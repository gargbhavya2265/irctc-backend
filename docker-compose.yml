name: irctc-backend

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: irctcpass
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - irctc-network
  
  pgadmin: 
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - irctc-network

  redis:
    image: redis/redis-stack:6.2.6-v19
    container_name: redis
    restart: always
    environment:
      REDIS_ARGS: "--requirepass irctcpass"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis_data:/data
    networks:
      - irctc-network
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - irctc-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper>
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - irctc-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: irctc-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - irctc-network
  
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - irctc-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    restart: always
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - irctc-network

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: user-service
    restart: always
    env_file:
      - ./user-service/.env
    ports:
      - "4001:4001"
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - irctc-network
  notification-service:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    container_name: notification-service
    restart: always
    env_file:
      - ./notification-service/.env
    environment:
      NODE_ENV: production
      KAFKA_BROKER: kafka:9092
    depends_on:
      - kafka
    networks:
      - irctc-network

  search-service:
    build:
      context: .
      dockerfile: ./search-service/Dockerfile
    container_name: search-service
    restart: always
    env_file:
      - ./search-service/.env
    environment:
      PORT: 4002
      NODE_ENV: production
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BROKER: kafka:9092
      ES_RECREATE_INDICES: "false"
    ports:
      - "4002:4002"
    depends_on:
      - elasticsearch
      - kafka
    networks:
      - irctc-network
  admin-service:
    build:
      context: .
      dockerfile: ./admin-service/Dockerfile
    container_name: admin-service
    restart: always
    env_file:
      - ./admin-service/.env
    ports:
      - "4003:4003"
    depends_on:
      - postgres
      - kafka
    networks:
      - irctc-network
  inventory-service:
    build:
      context: .
      dockerfile: ./inventory-service/Dockerfile
    container_name: inventory-service
    restart: always
    env_file:
      - ./inventory-service/.env
    environment:
      PORT: 4007
      NODE_ENV: production
      DATABASE_URL: postgres://admin:irctcpass@postgres:5432/inventory_service_database
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: inventory-service
      REDIS_URL: redis://:irctcpass@redis:6379
    ports:
      - "4007:4007"
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - irctc-network

  payment-service:
    build:
      context: .
      dockerfile: ./payment-service/Dockerfile
    container_name: payment-service
    restart: always
    env_file:
      - ./payment-service/.env
    environment:
      PORT: 4006
      NODE_ENV: production
      DATABASE_URL: postgres://admin:irctcpass@postgres:5432/payment_service_database
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: payment-service
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      PAYMENT_GATEWAY: razorpay
    ports:
      - "4006:4006"
    depends_on:
      - postgres
      - kafka
    networks:
      - irctc-network
  
  booking-service:
    build:
      context: .
      dockerfile: ./booking-service/Dockerfile
    container_name: booking-service
    restart: always
    environment:
      PORT: 4005
      NODE_ENV: production
      DATABASE_URL: postgres://admin:irctcpass@postgres:5432/booking_service_database
      REDIS_URL: redis://:irctcpass@redis:6379
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: booking-service
      USER_SERVICE_URL: http://user-service:4001
      ADMIN_SERVICE_URL: http://admin-service:4003
      INVENTORY_SERVICE_URL: http://inventory-service:4007
      PAYMENT_SERVICE_URL: http://payment-service:4006
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    ports:
      - "4005:4005"
    depends_on:
      - postgres
      - redis
      - kafka
      - user-service
      - admin-service
      - inventory-service
      - payment-service
    networks:
      - irctc-network
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    env_file:
      - ./api-gateway/.env
    ports:
      - "4000:4000"
    depends_on:
      - user-service
      - redis
    networks:
      - irctc-network
    
volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  es_data:

networks:
  irctc-network:
    driver: bridge
